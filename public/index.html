            doc.text(lines((f.area ? f.area + ' – ' : '') + (f.what || ''), ic[1][1] - 3)[0], x + 1.5 + ic[0][1], y + 3.9);
            doc.text(photoStamp(f.ts) || '—', x + 1.5 + ic[0][1] + ic[1][1], y + 3.9);
            idxRows.push({ page: pageNow(), x: x + ic[0][1] + ic[1][1] + ic[2][1], y, w: ic[3][1], h: rowH, idx: i });
            doc.setDrawColor(C.line[0], C.line[1], C.line[2]); doc.line(x, y + rowH, x + colW, y + rowH);
            y += rowH;
          }
        }
        y = BOTTOM + 1;
      }
    }
    for (const f of fullSize){
      newPage();
      f.page = pageNow();
      set('bold', 10, C.banner);
      doc.text(lines(f.title, CW - 40)[0], M, y + 2);
      set('normal', 8.5, C.inkSoft);
      doc.text('Taken ' + (photoStamp(f.ts) || 'time not recorded'), M, y + 7.5);
      set('bold', 9, C.banner);
      doc.textWithLink('\u00ab Back', PW - M - doc.getTextWidth('\u00ab Back'), y + 2, { pageNumber: f.backPage });
      const top = y + 11;
      drawFitted(f.dataUrl, f.alias, M, top, CW, BOTTOM - top);
    }
    thumbLinks.forEach(t => { doc.setPage(t.page); doc.link(t.x, t.y, t.w, t.h, { pageNumber: fullSize[t.idx].page }); });
    idxRows.forEach(r => {
      doc.setPage(r.page);
      set('bold', 7, C.banner);
      doc.textWithLink(String(fullSize[r.idx].page - 1), r.x + 1.5, r.y + 3.9, { pageNumber: fullSize[r.idx].page });
    });
  }

  /* ------------------------------------------------------- contents page */
  doc.setPage(tocPage);
  y = TOP;
  doc.setFillColor(C.banner[0], C.banner[1], C.banner[2]);
  doc.rect(M, y, CW, 8.6, 'F');
  set('bold', 10, C.white);
  doc.text('TABLE OF CONTENTS', PW / 2, y + 5.9, { align:'center' });
  y += 16;
  const half = Math.ceil(toc.length / 2);
  toc.forEach((entry, i) => {
    const col = i < half ? 0 : 1;
    const ty = TOP + 16 + (i - col * half) * 6.4;
    const tx = M + col * (CW / 2 + 4);
    set('normal', 9, C.ink);
    doc.text(String(entry[0]).toUpperCase(), tx, ty);
    set('normal', 9, C.banner);
    doc.text(String(entry[1] - 1), tx + CW / 2 - 12, ty, { align:'right' });
  });

  /* header and footer on every page */
  const total = doc.internal.getNumberOfPages();
  for (let p = 1; p <= total; p++) pageChrome(p);

  if (onProgress) onProgress(100);
  return doc.output('blob');

  /* ------------------------------------------------------------- helpers */
  async function photoGrid(shots, cols, onEach){
    if (!shots || !shots.length) return;
    const gap = 5;
    const cw = (CW - gap * (cols - 1)) / cols;
    const ih = cw * 0.75;
    for (let i = 0; i < shots.length; i += cols){
      const row = shots.slice(i, i + cols);
      if (y + ih + 13 > BOTTOM) newPage();
      const top = y;
      for (let c = 0; c < row.length; c++){
        const shot = row[c];
        const x = M + c * (cw + gap);
        if (onEach) onEach();
        const alias = 'photo-' + fullSize.length;
        if (drawFitted(shot.dataUrl, alias, x, top, cw, ih)){
          doc.setDrawColor(C.line[0], C.line[1], C.line[2]);
          doc.rect(x, top, cw, ih);
          thumbLinks.push({ page: pageNow(), x, y: top, w: cw, h: ih, idx: registerFullSize(shot, alias) });
        }
        set('normal', 7.6, C.inkSoft);
        doc.text(lines((shot.ref ? shot.ref + '  ·  ' : '') + String(shot.label || '').toUpperCase(), cw)[0], x + cw / 2, top + ih + 4, { align:'center' });
        set('normal', 6.8, C.faint);
        doc.text(photoStamp(shot.ts), x + cw / 2, top + ih + 8, { align:'center' });
      }
      y = top + ih + 13;
    }
  }
}

/* PDF download. The PDF is built once per finished report and kept, so Download, Open and Share run
   straight from the tap: phones block downloads that only start after a long build. */
let pdfReady = null;      // { key, blob, url, fname }
let pdfBuilding = null;
let pdfUi = { phase: 'idle', pct: 0, msg: '' };
function pdfFileName(s){
  return sanitizeFilename(s.meta.address) + ' - ' + sanitizeFilename(s.meta.inspectionType) + ' - ' + sanitizeFilename(s.meta.date) + ' - ' + sanitizeFilename(s.meta.ref || '') + '.pdf';
}
function formatBytes(n){ return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
function setPdfUi(phase, pct, msg){
  pdfUi = { phase, pct: pct || 0, msg: msg || '' };
  const status = document.getElementById('pdfStatus');
  const dl = document.getElementById('pdfDownloadBtn');
  const extra = document.querySelectorAll('.pdf-secondary');
  if (!status || !dl) return;
  const ready = phase === 'ready' && pdfReady;
  status.textContent = msg || (phase === 'building' ? 'Preparing your PDF… ' + (pct ? pct + '%' : '')
    : ready ? 'Ready · ' + formatBytes(pdfReady.blob.size)
    : phase === 'error' ? "Couldn't build the PDF. Tap Try again." : '');
  dl.disabled = phase === 'building';
  dl.textContent = phase === 'building' ? 'Preparing…' : phase === 'error' ? 'Try again' : 'Download PDF';
  extra.forEach(b => { b.disabled = !ready; });
}
function preparePdf(){
  if (pdfReady && pdfReady.key === state.finalizedAt) { setPdfUi('ready'); return Promise.resolve(pdfReady); }
  if (pdfBuilding) return pdfBuilding;
  setPdfUi('building', 0);
  pdfBuilding = (async () => {
    try {
      const blob = await buildPdfBlob(state, pct => setPdfUi('building', pct));
      if (pdfReady && pdfReady.url) URL.revokeObjectURL(pdfReady.url);
      pdfReady = { key: state.finalizedAt, blob, url: URL.createObjectURL(blob), fname: pdfFileName(state) };
      setPdfUi('ready');
      return pdfReady;
    } catch (err) {
      console.error('pdf failed', err);
      setPdfUi('error');
      return null;
    } finally { pdfBuilding = null; }
  })();
  return pdfBuilding;
}
function savePdf(){
  if (!pdfReady || pdfReady.key !== state.finalizedAt){
    preparePdf().then(r => { if (r) setPdfUi('ready', 0, 'Your PDF is ready. Tap Download PDF.'); });
    return;
  }
  const a = document.createElement('a');
  a.href = pdfReady.url; a.download = pdfReady.fname;
  document.body.appendChild(a); a.click(); a.remove();
  setPdfUi('ready', 0, 'Saved to your Downloads · ' + formatBytes(pdfReady.blob.size) + '. On iPhone: Files app → Downloads.');
}
function openPdf(){ if (pdfReady) window.open(pdfReady.url, '_blank'); }

/* A copy of every finished report is sent to the server, where only the owner can open it (/admin).
   Sent once per report (the server also ignores repeats); retried when the connection comes back. */
let submitting = false;
let submitUi = { phase: 'idle', msg: '' };
function setSubmitUi(phase, msg){
  submitUi = { phase, msg: msg || '' };
  const el = document.getElementById('submitStatus');
  if (!el) return;
  el.className = 'submit-status ' + phase;
  el.innerHTML = phase === 'sent' ? '✓ A copy has been sent to the managing agent.'
    : phase === 'sending' ? 'Sending a copy to the managing agent…'
    : phase === 'error' ? "Couldn't send a copy to the managing agent yet. " + escapeHtml(msg || '') + ' <button type="button" class="btn-ghost" onclick="submitReport()">Try again</button>'
    : '';
}
async function submitReport(){
  if (!state.finalizedAt) return;
  if (state.submittedId){ setSubmitUi('sent'); return; }
  if (submitting) return;
  submitting = true;
  setSubmitUi('sending');
  try {
    const r = await preparePdf();
    if (!r) throw new Error('The PDF could not be built.');
    const pr = state.property || {};
    const meta = {
      address: state.meta.address, inspectionType: state.meta.inspectionType, ref: state.meta.ref,
      inspectorName: state.meta.inspectorName, signedBy: state.meta.signedBy, createdAt: state.meta.createdAt,
      finalizedAt: state.finalizedAt, rooms: state.rooms.length,
      photos: totalCaptured() + ((pr.exterior && pr.exterior.photos.length) || 0), fileName: r.fname
    };
    const res = await fetch('/api/reports', { method: 'POST', headers: { 'Content-Type': 'application/pdf', 'X-Report-Meta': encodeURIComponent(JSON.stringify(meta)) }, body: r.blob });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.id) throw new Error(data.error || '');
    state.submittedId = data.id;
    state.submittedAt = new Date().toISOString();
    persist();
    setSubmitUi('sent');
  } catch (err) {
    console.error('report submit failed', err);
    setSubmitUi('error', navigator.onLine === false ? 'You appear to be offline; it will be sent when the connection is back.' : (err && err.message) || '');
  } finally { submitting = false; }
}
window.addEventListener('online', () => { if (state.view === 'done' && state.finalizedAt && !state.submittedId) submitReport(); });
function canSharePdf(){
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File([new Blob(['%PDF'])], 'r.pdf', { type: 'application/pdf' })] })); }
  catch (e) { return false; }
}
async function sharePdf(){
  if (!pdfReady) return;
  try {
    await navigator.share({ files: [new File([pdfReady.blob], pdfReady.fname, { type: 'application/pdf' })], title: state.meta.inspectionType + ' report' });
  } catch (e) {
    if (!e || e.name !== 'AbortError') setPdfUi('ready', 0, "Sharing didn't work here. Use Download PDF instead.");
  }
}

function renderCapture(){
  const room = getActiveRoom();
  if (!room) return renderSetup();
  const idx = state.rooms.findIndex(r => r.id === room.id);
  const isFirst = idx === 0, isLast = idx === state.rooms.length - 1;
  const pct = Math.min(100, Math.round((totalCaptured() / Math.max(1,totalRequired())) * 100));
  const complete = roomIsComplete(room);
  const missing = roomMissingItems(room);
  const shortfall = Math.max(0, roomRequiredTotal(room) - roomTotalPhotos(room));

  let reqParts = [];
  if (missing.length) reqParts.push(`${missing.length} item${missing.length===1?'':'s'} still need${missing.length===1?'s':''} a photo`);
  if (shortfall > 0) reqParts.push(`${shortfall} more photo${shortfall===1?'':'s'} needed to reach this room's ${roomRequiredTotal(room)}-photo minimum`);
  const noCond = roomItemsMissingCondition(room).length;
  if (noCond) reqParts.push(`${noCond} item${noCond===1?'':'s'} still need${noCond===1?'s':''} a condition`);
  if (!roomConditionComplete(room)) reqParts.push('room condition needs completing below');
  const reqMsg = complete ? 'All required photos and condition details captured for this room.' : reqParts.join(' · ');
  const aiBanner = aiEnabled === false
    ? `<div class="ai-status off">Automatic condition assessment is off (${escapeHtml(aiStatusNote)}). Set each condition yourself below.</div>`
    : '';
  return `
    ${aiBanner}
    <div class="masthead">
      <div class="kicker">${escapeHtml(state.meta.inspectionType)} · ${escapeHtml(state.meta.date)}</div>
      <h1>${escapeHtml(state.meta.address)}</h1>
      <div class="sub">${roomsComplete()} of ${state.rooms.length} rooms complete · ${totalCaptured()} of ${totalRequired()} photos captured</div>
      <div class="progress-bar-shell"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      <div class="autosave-note">Your progress is saved automatically on this device — safe to close and come back later.</div>
    </div>
    ${photoGuideHTML()}
    ${exteriorCardHTML()}
    <div class="capture-layout">
      <nav class="room-nav">
        ${state.rooms.map(r => {
          const dotClass = roomIsComplete(r) ? 'ok' : (roomTotalPhotos(r) > 0 ? 'warn' : '');
          return `<button type="button" class="room-nav-item ${r.id===room.id?'active':''}" onclick="setActiveRoom('${r.id}')">
            <span class="status-dot ${dotClass}"></span>
            <span class="rn-name">${escapeHtml(r.name)}</span>
            <span class="rn-count">${roomTotalPhotos(r)}/${roomRequiredTotal(r)}</span>
          </button>`;
        }).join('')}
      </nav>
      <div class="room-panel">
        <h2>${escapeHtml(room.name)}</h2>
        <div class="req-line ${complete ? 'ok' : 'warn'}">${reqMsg}</div>

        <input type="file" id="photoInput" accept="image/*" capture="environment" multiple style="display:none" onchange="handlePhotoInputChange(event)">

        ${room.items.map(item => itemCardHTML(room, item)).join('')}

        <div class="add-checklist-item">
          <input class="input" id="addItemInput_${room.id}" type="text" placeholder="Add another item to check, e.g. 'En-suite shower'" onkeydown="if(event.key==='Enter'){event.preventDefault(); addChecklistItem('${room.id}');}">
          <button type="button" class="btn btn-sm" onclick="addChecklistItem('${room.id}')">Add item</button>
        </div>

        <div class="extra-section">
          <span class="sec-label">Additional photos</span>
          <span class="sec-hint">${shortfall > 0 ? `${shortfall} more needed to reach this room's ${roomRequiredTotal(room)}-photo minimum${naCount(room) ? ` — marking items not applicable does not reduce it` : ''}.` : 'Optional — add more general condition photos if useful.'}</span>
          <div class="item-photo-row">
            <button type="button" class="add-item-photo" onclick="triggerExtraFileInput('${room.id}')" aria-label="Add photo">${ICONS.camera}<span>Add</span></button>
            ${room.extraPhotos.map(p => `
              <div class="item-thumb">
                <img src="${p.dataUrl}" onclick="openPhotoPreview('${p.dataUrl}')" alt="Additional photo">
                <button type="button" class="del-btn" onclick="deleteExtraPhoto('${room.id}','${p.id}')" aria-label="Delete photo">×</button>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="condition-section">

          <div class="field">
            <label for="cleanlinessInput">Cleanliness</label>
            <select class="select" id="cleanlinessInput" onchange="updateCleanliness('${room.id}', this.value)">
              <option value="">Select…</option>
              ${CLEANLINESS_OPTIONS.map(([val,label]) => `<option value="${val}" ${room.condition.cleanliness===val?'selected':''}>${label}</option>`).join('')}
            </select>
          </div>

              <button type="button" class="toggle-btn ${!room.condition.hasDamage?'active':''}" onclick="setDamageFlag('${room.id}', false)">None noted</button>

/* ============================= render dispatcher ============================= */
function render(){
  const app = document.getElementById('app');
  renderStepper();
  try {
    if (state.view === 'resume') { app.innerHTML = renderResume(); return; }
    if (state.view === 'setup') { app.innerHTML = renderSetup(); updateRoomCountHint(); updateMoveInHint(); }
    else if (state.view === 'capture') { app.innerHTML = renderCapture(); }
    else if (state.view === 'details') { app.innerHTML = renderDetails(); }
    else if (state.view === 'review') { app.innerHTML = renderReview(); initSignaturePad(); updateFinishButtonState(); }
    else if (state.view === 'done') { app.innerHTML = renderDone(); setPdfUi(pdfUi.phase, pdfUi.pct, pdfUi.msg); setSubmitUi(state.submittedId ? 'sent' : submitUi.phase, submitUi.msg); preparePdf(); if (!state.submittedId) submitReport(); }
  } catch (err) {
    console.error('Render failed:', err);
    app.innerHTML = '<div class="panel"><p style="margin-bottom:10px;">Something went wrong showing this screen.</p><p style="font-size:13px;color:var(--ink-soft);">' + escapeHtml(err && err.message ? err.message : String(err)) + '</p><button type="button" class="btn" style="margin-top:14px;" onclick="location.reload()">Reload</button></div>';
  }
}

/* ============================= boot ============================= */
render(); // paint instantly with no dependency on storage or network
(async () => {
  try {
    try { addressBook = (await idbGet('addressBook')) || []; if (addressBook.length && state.view === 'setup') render(); } catch(e){}
    const saved = await idbGet('current');
    if (saved && Array.isArray(saved.rooms) && saved.rooms.length && saved.finalizedAt && state.view === 'setup') {
      // A finished report stays on this device, ready to download again, until a new inspection is started.
      state = normalizeState(saved);
      state.view = 'done';
      render();
    } else if (saved && Array.isArray(saved.rooms) && saved.rooms.length && !saved.finalizedAt) {
      savedDraft = normalizeState(saved);
      state = defaultState();
      state.view = 'resume';
      render();
    }
  } catch (err) {
    console.error('Inventory app failed to check for a saved draft:', err);
  }
  initAI();
})();
</script>
</body>
</html>
