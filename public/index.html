      set('normal', 8, item.notApplicable ? C.faint : C.inkSoft);
      if (isOut) doc.text(cLines, xOut + 2, y + 5.2);
      else doc.text(cLines, xIn + 2, y + 5.2);
      doc.setDrawColor(C.line[0], C.line[1], C.line[2]);
      doc.line(M, y + h, PW - M, y + h);
      [xDesc, xIn, xOut, xLia].forEach(x => doc.line(x, y, x, y + h));
      y += h;
    }

    /* room summary line */
    y += 4;
    need(14);
    set('bold', 8.4, C.banner); doc.text('ROOM CLEANLINESS', M + 2, y + 4);
    set('normal', 8.4, C.ink); doc.text(cleanlinessLabel(room.condition.cleanliness), M + 46, y + 4);
    set('bold', 8.4, C.banner); doc.text('DAMAGE / DEFECTS', M + CW * 0.5, y + 4);
    set('normal', 8.4, C.ink);
    doc.text(lines(room.condition.hasDamage ? (room.condition.damageNotes || 'Noted, no detail given.') : 'None noted', CW * 0.32), M + CW * 0.5 + 44, y + 4);
    y += 10;
    if ((room.notes || '').trim()){
      const ls = lines('Notes: ' + room.notes, CW);
      need(ls.length * 4.2 + 4);
      set('normal', 8.4, C.inkSoft); doc.text(ls, M, y + 3);
      y += ls.length * 4.2 + 4;
    }

    /* photo pages, eight to a page */
    const shots = [];
    room.items.forEach(i => (i.photos || []).forEach(p => shots.push({ label:i.label, ts:p.ts, dataUrl:p.dataUrl })));
    (room.extraPhotos || []).forEach(p => shots.push({ label:'General view', ts:p.ts, dataUrl:p.dataUrl }));

    for (let i = 0; i < shots.length; i += 8){
      newPage();
      set('bold', 10.5, C.banner);
      doc.text((room.name + ' – ' + stage + ' PHOTOS').toUpperCase(), PW / 2, y + 2, { align:'center' });
      y += 10;
      await photoGrid(shots.slice(i, i + 8), 4, tick);
    }
  }

  /* ---------------------------------------------------------- declaration */
  newSection('Declaration form');
  const signedDate = s.finalizedAt ? new Date(s.finalizedAt).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '';
  const detTested = (pr.detectors || []).every(d => d.tested === 'Yes') ? 'YES' : 'SEE DETECTOR PAGE';
  const keysReleased = keys.some(k => /released to tenant/i.test(k.action || '')) ? 'YES' : 'NO';

  doc.setFillColor(C.head[0], C.head[1], C.head[2]);
  doc.rect(M, y, CW, 8, 'F');
  set('bold', 8, C.inkSoft);
  doc.text(stage + ' INFORMATION', M + 3, y + 5.4);
  doc.text('RECORDED', M + CW * 0.46, y + 5.4);
  doc.text('ADDITIONAL COMMENTS', M + CW * 0.62, y + 5.4);
  y += 8; rule();

  [
    ['General cleaning condition', (dcl.cleaning || 'Not recorded').toUpperCase(), ''],
    ['General property condition', conditionLabel((derivedPropertyCondition(s.rooms) || {}).key).toUpperCase(), derivedLabel(derivedPropertyCondition(s.rooms))],
    ['General decorative condition', conditionLabel((derivedDecorativeCondition(s.rooms) || {}).key).toUpperCase(), derivedLabel(derivedDecorativeCondition(s.rooms))],
    ['Smoke / CO detectors tested & audible', detTested, ''],
    ['Keys released to tenant(s)', keysReleased, keys.map(k => k.desc).join('; ')],
    ['All utility meters recorded', (dcl.metersRecorded || '').toUpperCase(), ''],
    ['Minimum eight photographs per room', 'YES', s.rooms.length + ' rooms  ·  ' + photoTotal + ' photographs, each date and time stamped'],
    ['Additional information', (dcl.additional || '').trim() ? 'YES' : 'NO', (dcl.additional || '').trim() || 'n/a']
  ].forEach(([k, v, note]) => {
    const nLines = lines(note || 'n/a', CW * 0.36);
    const h = Math.max(9, nLines.length * 4.1 + 4.4);
    need(h);
    set('normal', 8.4, C.ink); doc.text(k, M + 3, y + 5.6);
    set('bold', 8.4, C.banner); doc.text(String(v), M + CW * 0.46, y + 5.6);
    set('normal', 8.2, C.inkSoft); doc.text(nLines, M + CW * 0.62, y + 5.6);
    y += h; rule();
  });
  y += 6;

  const disclaimer = 'Disclaimer – any query or discrepancy relating to the descriptions or contents of this report must be raised in writing with the managing agent within 7 days of receipt. If nothing is received in writing within that period, this report is taken as an accurate representation of the cleanliness and condition of the property and its contents at the time of the inspection.';
  set('normal', 8, C.inkSoft);
  let dLines2 = lines(disclaimer, CW - 2);
  need(dLines2.length * 4 + 6);
  doc.text(dLines2, M, y + 3);
  y += dLines2.length * 4 + 7;

  const declarationText = 'I, ' + (s.meta.signedBy || s.meta.inspectorName) + ', confirm that I carried out this inspection myself, that every photograph in this report was taken by me at the property on the date and time stamped on it, and that the descriptions and condition ratings recorded here are an honest and accurate account of the property as I found it.';
  set('normal', 8.8, C.ink);
  const decLines = lines(declarationText, CW - 8);
  need(decLines.length * 4.3 + 62);
  doc.setFillColor(248, 249, 251);
  doc.rect(M, y, CW, decLines.length * 4.3 + 10, 'F');
  set('normal', 8.8, C.ink);
  doc.text(decLines, M + 3, y + 6);
  y += decLines.length * 4.3 + 14;

  const sigW = (CW - 10) / 2;
  need(50);
  set('bold', 8.4, C.banner); doc.text('COMPILED AND SIGNED BY', M, y);
  doc.text('TENANT(S) FULL NAME(S)', M + sigW + 10, y);
  y += 5;
  if (s.signatureDataUrl){
    const sig = await prepPhoto(s.signatureDataUrl, 760, 3/1);
    if (sig) doc.addImage(sig, 'JPEG', M, y, 62, 20.6);
  }
  doc.setDrawColor(C.line[0], C.line[1], C.line[2]);
  doc.line(M, y + 22, M + sigW, y + 22);
  doc.line(M + sigW + 10, y + 22, PW - M, y + 22);
  set('normal', 8.4, C.ink);
  doc.text(s.meta.signedBy || s.meta.inspectorName || '', M, y + 27);
  set('normal', 8.4, C.inkSoft);
  doc.text('Signed ' + (signedDate || dateLong), M, y + 32);
  set('bold', 8.4, C.banner);
  doc.text('TENANT(S) SIGNATURE(S)', M + sigW + 10, y + 32);
  doc.line(M + sigW + 10, y + 42, PW - M, y + 42);

  /* ------------------------------------------------------- contents page */
  doc.setPage(tocPage);
  y = TOP;
  doc.setFillColor(C.banner[0], C.banner[1], C.banner[2]);
  doc.rect(M, y, CW, 8.6, 'F');
  set('bold', 10, C.white);
  doc.text('TABLE OF CONTENTS', PW / 2, y + 5.9, { align:'center' });
  y += 16;
  const half = Math.ceil(toc.length / 2);
  toc.forEach((entry, i) => {
    const col = i < half ? 0 : 1;
    const ty = TOP + 16 + (i - col * half) * 6.4;
    const tx = M + col * (CW / 2 + 4);
    set('normal', 9, C.ink);
    doc.text(String(entry[0]).toUpperCase(), tx, ty);
    set('normal', 9, C.banner);
    doc.text(String(entry[1] - 1), tx + CW / 2 - 12, ty, { align:'right' });
  });

  /* header and footer on every page */
  const total = doc.internal.getNumberOfPages();
  for (let p = 1; p <= total; p++) pageChrome(p);

  if (onProgress) onProgress(100);
  return doc.output('blob');

  /* ------------------------------------------------------------- helpers */
  async function photoGrid(shots, cols, onEach){
    if (!shots || !shots.length) return;
    const gap = 5;
    const cw = (CW - gap * (cols - 1)) / cols;
    const ih = cw * 0.75;
    for (let i = 0; i < shots.length; i += cols){
      const row = shots.slice(i, i + cols);
      if (y + ih + 13 > BOTTOM) newPage();
      const top = y;
      for (let c = 0; c < row.length; c++){
        const shot = row[c];
        const x = M + c * (cw + gap);
        const img = await prepPhoto(shot.dataUrl, 1000, 4/3);
        if (onEach) onEach();
        if (img){
          doc.addImage(img, 'JPEG', x, top, cw, ih);
          doc.setDrawColor(C.line[0], C.line[1], C.line[2]);
          doc.rect(x, top, cw, ih);
        }
        set('normal', 7.6, C.inkSoft);
        doc.text(lines(String(shot.label || '').toUpperCase(), cw)[0], x + cw / 2, top + ih + 4, { align:'center' });
        set('normal', 6.8, C.faint);
        doc.text(photoStamp(shot.ts), x + cw / 2, top + ih + 8, { align:'center' });
      }
      y = top + ih + 13;
    }
  }
}

async function attemptDownload(){
  const statusEl = document.getElementById('downloadStatus');
  const setStatus = (t) => { if (statusEl) statusEl.textContent = t; };
  try{
    setStatus('Building your PDF…');
    const blob = await buildPdfBlob(state, (pct) => setStatus('Building your PDF… ' + pct + '%'));
    const fname = sanitizeFilename(state.meta.address) + ' - ' + sanitizeFilename(state.meta.inspectionType) + ' - ' + sanitizeFilename(state.meta.date) + ' - ' + sanitizeFilename(state.meta.ref || '') + '.pdf';
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    setStatus('PDF ready. Check your downloads.');
  }catch(err){
    console.error('pdf failed', err);
    setStatus("Couldn't build the PDF just now. Try the button again. The full report is shown below.");
  }
}

    </div>

      <button type="button" class="btn-ghost" onclick="goToDetails()">Skip to keys, meters &amp; sign-off</button>
    </div>
  `;
}

function selectHTML(path, value, options){
  return `<select class="select" onchange="setPropAndRender('${path}', this.value)">${options.map(o => `<option value="${escapeHtml(o)}" ${value===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}</select>`;
}
function renderDetails(){
  const pr = state.property;
  const d = pr.declaration;
  return `
    <div class="masthead">
      <div class="kicker">${escapeHtml(state.meta.inspectionType)} · ${escapeHtml(state.meta.date)}</div>
      <h1>Keys, meters &amp; sign-off</h1>
      <div class="sub">${escapeHtml(state.meta.address)}</div>
    </div>

    <input type="file" id="photoInput" accept="image/*" capture="environment" multiple style="display:none" onchange="handlePhotoInputChange(event)">

    <div class="panel">
      <span class="sec-label">Keys handed over</span>
      <span class="sec-hint">One line per set, e.g. "3x Yale, front door". Photograph the keys laid out before handing them over.</span>
      ${pr.keys.map((k, i) => `
        <div class="cond-row">
          <input class="input cond-note" type="text" placeholder="e.g. 2x Yale, front door" value="${escapeHtml(k.desc)}" oninput="setKey(${i},'desc',this.value)">
          <select class="select cond-select" onchange="setKey(${i},'action',this.value)">
            ${['Released to tenant','Held by agent','Held by landlord','Not provided'].map(o => `<option value="${o}" ${k.action===o?'selected':''}>${o}</option>`).join('')}
          </select>
          ${pr.keys.length > 1 ? `<button type="button" class="btn-ghost" onclick="removeKeyRow(${i})">Remove</button>` : ''}
        </div>
        <div class="item-photo-row">
          <button type="button" class="add-item-photo" onclick="triggerKeyFileInput(${i})" aria-label="Add photo">${ICONS.camera}<span>Add</span></button>
          ${(k.photos || []).map(ph => `
            <div class="item-thumb">
              <img src="${ph.dataUrl}" onclick="openPhotoPreview('${ph.dataUrl}')" alt="Keys">
              <button type="button" class="del-btn" onclick="deletePropPhoto('keys', ${i}, '${ph.id}')" aria-label="Delete photo">×</button>
            </div>`).join('')}
        </div>
      `).join('')}
      <div class="btn-row" style="margin-top:10px;"><button type="button" class="btn btn-sm" onclick="addKeyRow()">Add another set</button></div>
    </div>

    <div class="panel">
      <span class="sec-label">Utility meters</span>
      <span class="sec-hint">Readings taken on the day protect against later billing disputes.</span>
      ${Object.keys(pr.meters).map(key => {
        const m = pr.meters[key];
        return `
        <div class="meter-block">
          <label class="na-toggle" style="display:flex;align-items:center;gap:6px;">
            <input type="checkbox" ${m.na ? 'checked' : ''} onchange="toggleMeterNA('${key}', this.checked)">
            <strong style="font-size:13px;color:var(--ink);">${METER_LABELS[key]}</strong> <span style="font-size:12px;">not present</span>
          </label>
          ${m.na ? '' : `
            <div class="cond-row">
              <input class="input" type="text" inputmode="decimal" placeholder="Reading, e.g. 37033.9 ${METER_UNITS[key] || ''}" value="${escapeHtml(m.reading)}" oninput="setProp('meters.${key}.reading', this.value)">
            </div>
            <div class="cond-row">
              <input class="input" type="text" placeholder="Serial number" value="${escapeHtml(m.serial || '')}" oninput="setProp('meters.${key}.serial', this.value)">
              <input class="input" type="text" placeholder="Location, e.g. hallway cupboard" value="${escapeHtml(m.location || '')}" oninput="setProp('meters.${key}.location', this.value)">
            </div>
            <div class="item-photo-row">
              <button type="button" class="add-item-photo" onclick="triggerMeterFileInput('${key}')" aria-label="Add photo">${ICONS.camera}<span>Add</span></button>
              ${(m.photos || []).map(ph => `
                <div class="item-thumb">
                  <img src="${ph.dataUrl}" onclick="openPhotoPreview('${ph.dataUrl}')" alt="${METER_LABELS[key]}">
                  <button type="button" class="del-btn" onclick="deletePropPhoto('meter', '${key}', '${ph.id}')" aria-label="Delete photo">×</button>
                </div>`).join('')}
            </div>
            <div class="cond-help">${(m.photos || []).length ? 'Reading photographed.' : 'Photograph the meter face showing the reading.'}</div>`}
        </div>`;
      }).join('')}
    </div>

    <div class="panel">
      <span class="sec-label">Smoke, heat &amp; CO detectors</span>
      <div class="row2">
        <div class="field">
          <label>Floors in the property</label>
          <input class="input" type="number" min="1" max="10" value="${escapeHtml(pr.floors)}" oninput="setProp('floors', this.value)">
        </div>
        <div class="field">
          <label>Detector on every floor</label>
          ${selectHTML('detectorsAllFloors', pr.detectorsAllFloors, YESNO)}
        </div>
      </div>
      <div class="field">
        <label>Heating source</label>
        ${selectHTML('heatingSource', pr.heatingSource, ['Gas boiler','Electric','Central heating','Wood','Other'])}
      </div>
      ${pr.detectors.map((dt, i) => `
        <div class="cond-row">
          <select class="select cond-select" onchange="setDetector(${i},'category',this.value)">
            ${['Smoke detector','Heat detector','CO detector','CO &amp; heat detector'].map(o => `<option value="${o}" ${dt.category===o?'selected':''}>${o}</option>`).join('')}
          </select>
          <input class="input cond-note" type="text" placeholder="Location, e.g. hallway" value="${escapeHtml(dt.location)}" oninput="setDetector(${i},'location',this.value)">
          <select class="select cond-select" onchange="setDetector(${i},'tested',this.value)">
            ${YESNO.map(o => `<option value="${o}" ${dt.tested===o?'selected':''}>Tested: ${o}</option>`).join('')}
          </select>
          ${pr.detectors.length > 1 ? `<button type="button" class="btn-ghost" onclick="removeDetectorRow(${i})">Remove</button>` : ''}
        </div>
      `).join('')}
      <div class="btn-row" style="margin-top:10px;"><button type="button" class="btn btn-sm" onclick="addDetectorRow()">Add another detector</button></div>
    </div>

    <div class="panel">
      <span class="sec-label">Declaration form</span>
      <div class="field">
        <label>General cleaning condition</label>
        <select class="select" onchange="setPropAndRender('declaration.cleaning', this.value)">
          <option value="">Select…</option>
          ${['Professionally cleaned','Clean','Further cleaning required','Not cleaned'].map(o => `<option value="${o}" ${d.cleaning===o?'selected':''}>${o}</option>`).join('')}
        </select>
      </div>
      <div class="decl-row">
        <span>General property condition</span>
        <strong style="font-size:13px;">${escapeHtml(derivedLabel(derivedPropertyCondition()))}</strong>
      </div>
      <div class="decl-row">
        <span>General decorative condition</span>
        <strong style="font-size:13px;">${escapeHtml(derivedLabel(derivedDecorativeCondition()))}</strong>
      </div>
      <div class="cond-help">Both are worked out from the condition you recorded against each item, so they cannot be set by hand.</div>
      <div class="decl-row">
        <span>All utility meters recorded</span>
        ${selectHTML('declaration.metersRecorded', d.metersRecorded, YESNO)}
      </div>
      <div class="field" style="margin-top:12px;">
        <label>Additional information</label>
        <textarea class="textarea" placeholder="Anything else the landlord or tenant should have on record." oninput="setProp('declaration.additional', this.value)">${escapeHtml(d.additional)}</textarea>
      </div>
    </div>

    ${detailsError ? `<div class="setup-error" id="detailsError">${escapeHtml(detailsError)}</div>` : ''}

    <div class="btn-row" style="margin-top:18px;">
      <button type="button" class="btn" onclick="backToCapture()">← Back to rooms</button>
      <button type="button" class="btn btn-primary" onclick="continueFromDetails()">Continue to review &amp; sign →</button>
    </div>
  `;
}

function renderReview(){
  const allOk = state.rooms.every(roomIsComplete);
  const aiWarnings = countAiWarnings();
  return `
    <div class="masthead">
      <div class="kicker">${escapeHtml(state.meta.inspectionType)} · ${escapeHtml(state.meta.date)}</div>
      <h1>Review &amp; sign</h1>
      <div class="sub">${escapeHtml(state.meta.address)}</div>
    </div>
    <div class="panel">
      <table class="summary-table">
        <thead><tr><th>Room</th><th>Photos</th><th>Status</th></tr></thead>
        <tbody>
          ${state.rooms.map(r => {
            const ok = roomIsComplete(r);
            return `<tr class="row-click" onclick="backToCapture('${r.id}')">
              <td>${escapeHtml(r.name)}</td>
              <td>${roomTotalPhotos(r)} / ${roomRequiredTotal(r)}</td>
              <td><span class="status-pill ${ok ? 'ok' : 'warn'}">${ok ? 'Complete' : 'Needs attention'}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>

      ${aiWarnings > 0 ? `<div class="hint-banner">The AI photo check flagged ${aiWarnings} photo${aiWarnings===1?'':'s'} that may not clearly match its checklist item. Tap into the relevant room to take a quick look — it's a helpful check, not always right.</div>` : ''}

      <div class="declaration-box">
        <p>I confirm that this inventory report has been completed honestly and thoroughly, and represents an accurate and truthful record of the property's condition at the date and time shown above.</p>
        <div class="declaration-check">
          <input type="checkbox" id="declarationCheck" ${state.declarationAccepted ? 'checked' : ''} onchange="onDeclarationChange(this.checked)">
          <label for="declarationCheck">I confirm the above is true, to the best of my knowledge.</label>
        </div>
      </div>

      <div class="field">
        <label for="signedByInput">Signed by</label>
        <input class="input" id="signedByInput" type="text" value="${escapeHtml(state.meta.inspectorName)}" oninput="onSignedByChange(this.value)">
      </div>

      <div class="field">
        <label>Signature</label>
        <div class="sig-wrap">
          <canvas id="sigCanvas"></canvas>
          <div class="sig-placeholder" id="sigPlaceholder">Sign here</div>
        </div>
        <div class="btn-row" style="margin-top:8px;">
          <button type="button" class="btn-ghost" onclick="clearSignature()">Clear signature</button>
        </div>
      </div>

      ${!allOk ? `<div class="hint-banner">Some rooms still need attention (photos or condition details) before the report can be finished. Tap a room above to go back.</div>` : ''}

      <p class="finish-help" id="finishHelp"></p>
      <button type="button" class="btn btn-primary btn-block" id="finishBtn" onclick="completeReport()">Finish &amp; generate report</button>
    </div>
  `;
}

function renderDone(){
  return `
    <div class="masthead">
      <div class="kicker">${escapeHtml(state.meta.inspectionType)} · ${escapeHtml(state.meta.date)}</div>
      <h1>Report complete</h1>
      <div class="sub">${escapeHtml(state.meta.address)}</div>
    </div>
    <div class="done-banner">
      <span class="mark">✓</span>
      <div>
        <div style="font-weight:700;">Signed off by ${escapeHtml(state.meta.signedBy || state.meta.inspectorName)}</div>
        <div id="downloadStatus">Preparing your PDF…</div>
        <div class="btn-row" style="margin-top:10px;">
          <button type="button" class="btn" onclick="attemptDownload()">Download report (PDF)</button>
        </div>
      </div>
    </div>

    <div class="report-doc">
      <h2>Self Check-In Report</h2>
      <div class="report-meta">
        ${escapeHtml(state.meta.address)}<br>
        ${escapeHtml(state.meta.inspectionType)} · ${escapeHtml(state.meta.date)}<br>
        ${state.meta.moveInDateTime ? `Move-in: ${escapeHtml(formatDateTimeLocal(state.meta.moveInDateTime))}<br>` : ''}
        Inspector: ${escapeHtml(state.meta.inspectorName)} · Rooms: ${state.rooms.length} · Photos: ${totalCaptured()}
      </div>
      ${state.signatureDataUrl ? `<img class="sig-preview" src="${state.signatureDataUrl}" alt="Signature">` : ''}
      ${state.rooms.map(r => `
        <div class="report-room">
          <h3>${escapeHtml(r.name)} <span style="font-weight:400; color:var(--ink-faint); font-size:13px;">(${roomTotalPhotos(r)} photos)</span></h3>
          ${conditionBlockHTML(r, false)}
          <p class="notes">${r.notes ? escapeHtml(r.notes) : 'No additional notes recorded.'}</p>
          ${r.items.map(itemBlockHTML).join('')}
          ${r.extraPhotos.length ? `<div class="report-item"><div class="il">Additional photos</div><div class="report-photo-grid">${r.extraPhotos.map(p => `<img src="${p.dataUrl}" alt="Additional photo">`).join('')}</div></div>` : ''}
        </div>
      `).join('')}
    </div>

    <div class="btn-row" style="margin-top:24px; justify-content:center;">
      <button type="button" class="btn-ghost" onclick="startNewInspection()">Start a new inspection</button>
    </div>
    <div class="hidden reset-confirm" id="resetConfirm">
      This clears the current report from this device. Make sure you've downloaded it first.
      <div class="btn-row">
        <button type="button" class="btn" onclick="cancelReset()">Cancel</button>
        <button type="button" class="btn btn-accent" onclick="confirmReset()">Yes, start new</button>
      </div>
    </div>
  `;
}

/* ============================= render dispatcher ============================= */
function render(){
  const app = document.getElementById('app');
  renderStepper();
  try {
    if (state.view === 'resume') { app.innerHTML = renderResume(); return; }
    if (state.view === 'setup') { app.innerHTML = renderSetup(); updateRoomCountHint(); updateMoveInHint(); }
    else if (state.view === 'capture') { app.innerHTML = renderCapture(); }
    else if (state.view === 'details') { app.innerHTML = renderDetails(); }
    else if (state.view === 'review') { app.innerHTML = renderReview(); initSignaturePad(); updateFinishButtonState(); }
    else if (state.view === 'done') { app.innerHTML = renderDone(); }
  } catch (err) {
    console.error('Render failed:', err);
    app.innerHTML = '<div class="panel"><p style="margin-bottom:10px;">Something went wrong showing this screen.</p><p style="font-size:13px;color:var(--ink-soft);">' + escapeHtml(err && err.message ? err.message : String(err)) + '</p><button type="button" class="btn" style="margin-top:14px;" onclick="location.reload()">Reload</button></div>';
  }
}

/* ============================= boot ============================= */
render(); // paint instantly with no dependency on storage or network
(async () => {
  try {
    try { addressBook = (await idbGet('addressBook')) || []; if (addressBook.length && state.view === 'setup') render(); } catch(e){}
    const saved = await idbGet('current');
    if (saved && Array.isArray(saved.rooms) && saved.rooms.length && !saved.finalizedAt) {
      savedDraft = normalizeState(saved);
      state = defaultState();
      state.view = 'resume';
      render();
    }
  } catch (err) {
    console.error('Inventory app failed to check for a saved draft:', err);
  }
  initAI();
})();
</script>
